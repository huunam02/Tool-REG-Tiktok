<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dò dấu hiệu thiết bị v2</title>
<style>
/* Layout: one reading column; a status line, two actions and the raw result. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2230; --muted: #5d6676;
  --line: #dde1e8; --accent: #2457c5; --ok: #2e7d4f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1a2029; --fg: #e5e9f0; --muted: #98a2b3;
  --line: #2c3442; --accent: #7aa2ff; --ok: #6fcf97; color-scheme: dark } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 18px; }
h1 { margin: 0; font-size: 1.5rem; }
p { margin: 0; color: var(--muted); }
ol { margin: 0; padding-left: 20px; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
button { font: 600 15px system-ui, sans-serif; background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
#status { font-size: 14px; color: var(--muted); }
#status.done { color: var(--ok); font-weight: 600; }
textarea { width: 100%; box-sizing: border-box; min-height: 220px; font: 12px ui-monospace, Consolas, monospace; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
</style>
</head>
<body>
<main>
  <h1>Dò dấu hiệu thiết bị v2</h1>
  <p>Mở bằng Firefox trên máy Windows đăng ký TikTok được, ở cửa sổ phóng to như khi dùng bình thường. Không cần bấm gì trong lúc đo (khoảng 5 giây).</p>
  <ol>
    <li>Đợi dòng trạng thái báo <b>Xong</b>.</li>
    <li>Bấm <b>Tải file kết quả</b> rồi gửi file đó, hoặc bấm <b>Copy</b> rồi dán gửi lại.</li>
  </ol>
  <div class="bar">
    <button id="download" type="button" disabled>Tải file kết quả</button>
    <button id="copy" type="button" class="secondary" disabled>Copy</button>
    <span id="status">Đang đo…</span>
  </div>
  <textarea id="raw" readonly aria-label="Kết quả dạng JSON"></textarea>
</main>
<script>
'use strict';
const safe = (fn, fallback = 'lỗi') => { try { return fn(); } catch (e) { return fallback + ': ' + e.name; } };
const names = (obj) => safe(() => Object.getOwnPropertyNames(obj).filter((n) => !/^\d+$/.test(n)).sort(), []);
// A step that never settles (some APIs wait on the OS) must not block the rest.
const within = (promise, ms = 4000) => Promise.race([promise, new Promise((r) => setTimeout(() => r('hết giờ'), ms))]);
async function sha(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}

function basics() {
  const n = navigator, s = screen;
  return {
    userAgent: n.userAgent, appVersion: n.appVersion, platform: n.platform, oscpu: n.oscpu,
    vendor: n.vendor, product: n.product, productSub: n.productSub, buildID: n.buildID,
    languages: n.languages, language: n.language, cpu: n.hardwareConcurrency,
    maxTouchPoints: n.maxTouchPoints, webdriver: n.webdriver, doNotTrack: n.doNotTrack,
    globalPrivacyControl: n.globalPrivacyControl, cookieEnabled: n.cookieEnabled,
    pdfViewerEnabled: n.pdfViewerEnabled, plugins: Array.from(n.plugins).map((p) => p.name),
    mimeTypes: Array.from(n.mimeTypes).map((m) => m.type), onLine: n.onLine,
    gpu: typeof n.gpu, share: typeof n.share, connection: typeof n.connection,
    getBattery: typeof n.getBattery, vibrate: typeof n.vibrate, wakeLock: typeof n.wakeLock,
    screen: [s.width, s.height, s.availWidth, s.availHeight, s.availLeft, s.availTop, s.colorDepth, s.pixelDepth],
    orientation: s.orientation && [s.orientation.type, s.orientation.angle],
    window: [innerWidth, innerHeight, outerWidth, outerHeight, screenX, screenY, devicePixelRatio],
    visualViewport: window.visualViewport && [visualViewport.width, visualViewport.height, visualViewport.scale],
    documentElement: [document.documentElement.clientWidth, document.documentElement.clientHeight],
    windowOrientation: typeof window.orientation, ontouchstart: 'ontouchstart' in window,
    TouchEvent: typeof window.TouchEvent, PointerEvent: typeof window.PointerEvent,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    intl: Intl.DateTimeFormat().resolvedOptions().locale,
    numberLocale: new Intl.NumberFormat().resolvedOptions().locale,
    dateString: new Date(2020, 0, 1, 12).toString(), tzOffset: new Date(2020, 0, 1).getTimezoneOffset(),
    localeString: new Date(2020, 0, 1, 12).toLocaleString(), number: (1234567.891).toLocaleString(),
  };
}

function mediaFeatures() {
  const q = {};
  const queries = [
    '(pointer: fine)', '(pointer: coarse)', '(pointer: none)', '(any-pointer: fine)', '(any-pointer: coarse)',
    '(hover: hover)', '(hover: none)', '(any-hover: hover)', '(orientation: landscape)', '(orientation: portrait)',
    '(prefers-color-scheme: dark)', '(prefers-reduced-motion: reduce)', '(prefers-contrast: more)',
    '(forced-colors: active)', '(inverted-colors: inverted)', '(color-gamut: srgb)', '(color-gamut: p3)',
    '(dynamic-range: high)', '(display-mode: browser)', '(update: fast)', '(scripting: enabled)',
    '(-moz-platform: windows)', '(-moz-platform: android)', '(-moz-platform: linux)', '(-moz-platform: macos)',
    '(min-resolution: 1.25dppx)', '(max-resolution: 1dppx)', '(prefers-reduced-transparency: reduce)',
  ];
  for (const m of queries) q[m] = safe(() => matchMedia(m).matches);
  return q;
}

function fonts() {
  const list = ['Arial', 'Arial Black', 'Calibri', 'Cambria', 'Candara', 'Comic Sans MS', 'Consolas', 'Constantia',
    'Corbel', 'Courier New', 'Ebrima', 'Franklin Gothic Medium', 'Gabriola', 'Gadugi', 'Georgia', 'Impact',
    'Javanese Text', 'Leelawadee UI', 'Lucida Console', 'Lucida Sans Unicode', 'Malgun Gothic', 'Marlett',
    'Microsoft Himalaya', 'Microsoft JhengHei', 'Microsoft New Tai Lue', 'Microsoft PhagsPa', 'Microsoft Sans Serif',
    'Microsoft Tai Le', 'Microsoft YaHei', 'Microsoft Yi Baiti', 'MingLiU-ExtB', 'Mongolian Baiti', 'MS Gothic',
    'MV Boli', 'Myanmar Text', 'Nirmala UI', 'Palatino Linotype', 'Segoe MDL2 Assets', 'Segoe Print', 'Segoe Script',
    'Segoe UI', 'Segoe UI Emoji', 'Segoe UI Historic', 'Segoe UI Symbol', 'SimSun', 'Sitka Text', 'Sylfaen', 'Symbol',
    'Tahoma', 'Times New Roman', 'Trebuchet MS', 'Verdana', 'Webdings', 'Wingdings', 'Yu Gothic',
    'Roboto', 'Noto Sans', 'Noto Serif', 'Noto Color Emoji', 'Droid Sans', 'Droid Sans Mono', 'Cutive Mono',
    'Coming Soon', 'Dancing Script', 'Carrois Gothic SC', 'SamsungOne', 'SEC Roboto Light', 'Source Sans Pro',
    'Helvetica', 'Helvetica Neue', 'Menlo', 'Monaco', 'SF Pro', 'DejaVu Sans', 'Liberation Sans', 'Ubuntu'];
  const c = document.createElement('canvas').getContext('2d');
  const text = 'mmmmmmmmmmlli1WQ@#';
  const width = (f) => { c.font = '72px ' + f; return c.measureText(text).width; };
  const bases = ['monospace', 'sans-serif', 'serif'].map((b) => [b, width(b)]);
  const found = list.filter((f) => bases.some(([b, w]) => width("'" + f + "'," + b) !== w));
  const probe = document.createElement('span');
  probe.textContent = text;
  document.body.appendChild(probe);
  const resolved = {};
  for (const generic of ['system-ui', 'sans-serif', 'serif', 'monospace', 'cursive', 'fantasy', 'caption', 'menu', 'message-box', 'status-bar']) {
    const isFont = ['caption', 'menu', 'message-box', 'status-bar'].includes(generic);
    probe.style.font = isFont ? generic : '16px ' + generic;
    const cs = getComputedStyle(probe);
    resolved[generic] = [cs.fontFamily, cs.fontSize, Math.round(probe.getBoundingClientRect().width * 100) / 100];
  }
  probe.remove();
  return { found, resolved, defaultBody: getComputedStyle(document.body).fontFamily };
}

async function canvasHashes() {
  const out = {};
  const draw = (fn, w = 240, h = 60) => {
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); fn(ctx); return cv.toDataURL();
  };
  out.text = await sha(draw((x) => { x.textBaseline = 'top'; x.font = '16px Arial'; x.fillStyle = '#f60'; x.fillRect(100, 1, 62, 20);
    x.fillStyle = '#069'; x.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15); x.fillStyle = 'rgba(102,204,0,0.7)'; x.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17); }));
  out.emoji = await sha(draw((x) => { x.font = '32px sans-serif'; x.fillText('😀👍🇻🇳❤️', 2, 40); }));
  out.systemUi = await sha(draw((x) => { x.font = '20px system-ui'; x.fillText('Hamburgefonstiv 0123', 2, 30); }));
  out.shapes = await sha(draw((x) => { x.beginPath(); x.arc(50, 30, 25, 0, Math.PI * 2); x.fillStyle = '#c36'; x.fill();
    const g = x.createLinearGradient(0, 0, 200, 0); g.addColorStop(0, 'red'); g.addColorStop(1, 'blue'); x.fillStyle = g; x.fillRect(90, 10, 140, 40); }));
  const c = document.createElement('canvas').getContext('2d'); c.font = '16px sans-serif';
  out.textMetrics = ['Hamburgefonstiv', '😃', 'Tiếng Việt'].map((t) => { const m = c.measureText(t); return [m.width, m.actualBoundingBoxAscent, m.actualBoundingBoxDescent].map((v) => Math.round(v * 1000) / 1000); });
  return out;
}

async function audio() {
  try {
    const ctx = new OfflineAudioContext(1, 5000, 44100);
    const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12; comp.attack.value = 0; comp.release.value = 0.25;
    osc.connect(comp); comp.connect(ctx.destination); osc.start(0);
    const buf = await ctx.startRendering();
    const data = buf.getChannelData(0);
    let sum = 0; for (let i = 4500; i < 5000; i++) sum += Math.abs(data[i]);
    const live = new AudioContext();
    const info = { sum: sum.toString(), sampleRate: live.sampleRate, baseLatency: live.baseLatency, outputLatency: live.outputLatency, maxChannels: live.destination.maxChannelCount };
    live.close();
    return info;
  } catch (e) { return 'lỗi: ' + e.name; }
}

function webgl(version) {
  const gl = document.createElement('canvas').getContext(version);
  if (!gl) return null;
  const p = {};
  const params = ['VERSION', 'SHADING_LANGUAGE_VERSION', 'VENDOR', 'RENDERER', 'MAX_TEXTURE_SIZE', 'MAX_CUBE_MAP_TEXTURE_SIZE',
    'MAX_RENDERBUFFER_SIZE', 'MAX_VIEWPORT_DIMS', 'MAX_VERTEX_ATTRIBS', 'MAX_VERTEX_UNIFORM_VECTORS', 'MAX_FRAGMENT_UNIFORM_VECTORS',
    'MAX_VARYING_VECTORS', 'MAX_TEXTURE_IMAGE_UNITS', 'MAX_VERTEX_TEXTURE_IMAGE_UNITS', 'MAX_COMBINED_TEXTURE_IMAGE_UNITS',
    'ALIASED_LINE_WIDTH_RANGE', 'ALIASED_POINT_SIZE_RANGE', 'RED_BITS', 'GREEN_BITS', 'BLUE_BITS', 'ALPHA_BITS', 'DEPTH_BITS',
    'STENCIL_BITS', 'SUBPIXEL_BITS', 'SAMPLES', 'SAMPLE_BUFFERS', 'MAX_3D_TEXTURE_SIZE', 'MAX_ARRAY_TEXTURE_LAYERS',
    'MAX_COLOR_ATTACHMENTS', 'MAX_DRAW_BUFFERS', 'MAX_SAMPLES', 'MAX_UNIFORM_BUFFER_BINDINGS', 'MAX_UNIFORM_BLOCK_SIZE',
    'MAX_VERTEX_UNIFORM_COMPONENTS', 'MAX_FRAGMENT_UNIFORM_COMPONENTS', 'MAX_ELEMENT_INDEX', 'MAX_SERVER_WAIT_TIMEOUT'];
  for (const k of params) if (gl[k] !== undefined) p[k] = safe(() => { const v = gl.getParameter(gl[k]); return v && v.length !== undefined && typeof v !== 'string' ? Array.from(v) : v; });
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  if (dbg) { p.UNMASKED_VENDOR = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL); p.UNMASKED_RENDERER = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL); }
  const prec = {};
  for (const shader of ['VERTEX_SHADER', 'FRAGMENT_SHADER']) for (const t of ['HIGH_FLOAT', 'MEDIUM_FLOAT', 'LOW_FLOAT', 'HIGH_INT']) {
    const f = gl.getShaderPrecisionFormat(gl[shader], gl[t]); prec[shader + '.' + t] = [f.rangeMin, f.rangeMax, f.precision];
  }
  const attrs = gl.getContextAttributes();
  return { params: p, extensions: (gl.getSupportedExtensions() || []).sort(), precision: prec, antialias: attrs && attrs.antialias };
}

function codecs() {
  const v = document.createElement('video'), a = document.createElement('audio');
  const types = ['video/mp4; codecs="avc1.42E01E"', 'video/mp4; codecs="avc1.640028"', 'video/mp4; codecs="hvc1.1.6.L93.B0"',
    'video/mp4; codecs="av01.0.05M.08"', 'video/webm; codecs="vp8"', 'video/webm; codecs="vp9"', 'video/webm; codecs="av01.0.05M.08"',
    'video/ogg; codecs="theora"', 'audio/mp4; codecs="mp4a.40.2"', 'audio/webm; codecs="opus"', 'audio/ogg; codecs="vorbis"',
    'audio/flac', 'audio/mpeg', 'audio/wav', 'audio/aac', 'video/x-matroska', 'application/vnd.apple.mpegurl'];
  const out = {};
  for (const t of types) out[t] = [ (t.startsWith('audio') ? a : v).canPlayType(t), safe(() => window.MediaSource ? MediaSource.isTypeSupported(t) : 'none') ];
  return out;
}

function mathValues() {
  return [Math.tan(-1e300), Math.sin(-1e300), Math.cos(1e10), Math.acosh(1e300), Math.asinh(1), Math.atanh(0.5),
    Math.expm1(1), Math.log1p(10), Math.sinh(1), Math.cosh(1), Math.tanh(1), Math.cbrt(100), Math.exp(10), Math.pow(Math.PI, -100)].map(String);
}

async function extras() {
  const out = {};
  out.voices = await new Promise((resolve) => {
    if (!window.speechSynthesis) return resolve('không có');
    const read = () => speechSynthesis.getVoices().map((v) => v.name + '|' + v.lang + '|' + v.localService);
    if (read().length) return resolve(read());
    speechSynthesis.onvoiceschanged = () => resolve(read());
    setTimeout(() => resolve(read()), 2500);
  });
  out.devices = await within(safe(async () => {
    const list = await navigator.mediaDevices.enumerateDevices();
    const counts = {}; for (const d of list) counts[d.kind] = (counts[d.kind] || 0) + 1; return counts;
  }, null));
  out.permissions = {};
  for (const name of ['notifications', 'geolocation', 'camera', 'microphone', 'persistent-storage', 'push']) {
    out.permissions[name] = await within(navigator.permissions.query({ name }).then((s) => s.state, (e) => 'lỗi: ' + e.name), 1500);
  }
  out.storage = await within(safe(async () => { const e = await navigator.storage.estimate(); return e.quota; }, null));
  out.workerCpu = await new Promise((resolve) => {
    try {
      const url = URL.createObjectURL(new Blob(['postMessage([navigator.hardwareConcurrency, navigator.userAgent, navigator.platform, navigator.languages])'], { type: 'text/javascript' }));
      const w = new Worker(url); const t = setTimeout(() => resolve('không đo được'), 3000);
      w.onmessage = (e) => { clearTimeout(t); resolve(e.data); w.terminate(); };
    } catch (e) { resolve('lỗi: ' + e.name); }
  });
  out.gpuAdapter = await within(safe(async () => {
    if (!navigator.gpu) return 'không có';
    const ad = await navigator.gpu.requestAdapter();
    if (!ad) return 'null';
    const info = ad.info || {};
    return { vendor: info.vendor, architecture: info.architecture, features: Array.from(ad.features).sort(), maxTex: ad.limits.maxTextureDimension2D };
  }, null));
  out.errorStack = safe(() => { throw new Error('x'); }, '');
  try { null.f(); } catch (e) { out.errorMessage = e.message; }
  out.performanceNowStep = (() => { const a = performance.now(); let b = a; for (let i = 0; i < 1e7 && b === a; i++) b = performance.now(); return Math.round((b - a) * 1e6) / 1e6; })();
  return out;
}

async function run() {
  const r = { version: 2, measuredAt: new Date().toISOString() };
  r.basics = safe(basics, {});
  r.media = safe(mediaFeatures, {});
  r.fonts = safe(fonts, {});
  r.canvas = await within(canvasHashes().catch((e) => 'lỗi: ' + e.name));
  r.audio = await within(audio());
  r.webgl = safe(() => webgl('webgl'), null);
  r.webgl2 = safe(() => webgl('webgl2'), null);
  r.codecs = safe(codecs, {});
  r.math = safe(mathValues, []);
  r.extras = await within(extras(), 12000);
  r.apis = { window: names(window), navigator: names(Navigator.prototype), screen: names(Screen.prototype),
    document: names(Document.prototype), htmlElement: names(HTMLElement.prototype), css: safe(() => Object.keys(document.body.style).length) };
  const json = JSON.stringify(r);
  document.getElementById('raw').value = json;
  // Local test runs only: hand the result to the measuring server.
  if (location.hostname === '127.0.0.1') fetch('/result', { method: 'POST', body: json }).catch(() => {});
  const status = document.getElementById('status');
  status.textContent = 'Xong. Bấm Tải file kết quả hoặc Copy.';
  status.className = 'done';
  const dl = document.getElementById('download'), cp = document.getElementById('copy');
  dl.disabled = cp.disabled = false;
  dl.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'ket-qua-may-tinh.json';
    document.body.appendChild(a); a.click(); a.remove();
  };
  cp.onclick = () => navigator.clipboard.writeText(json).then(
    () => { cp.textContent = 'Đã copy'; },
    () => { const ta = document.getElementById('raw'); ta.focus(); ta.select(); status.textContent = 'Nhấn Ctrl+C để copy ô bên dưới.'; });
}
run().catch((e) => { document.getElementById('status').textContent = 'Lỗi khi đo: ' + e.name + ' ' + e.message; });
</script>
</body>
</html>
