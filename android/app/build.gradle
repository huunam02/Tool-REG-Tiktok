plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.brisklane.browser"
    // GeckoView 158 requires compileSdk 37.2.
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.brisklane.browser"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Android 9 (Galaxy S8). The hev-socks5-tunnel AAR declares API 29, but
        // its native library only needs API 24 libc; the manifest overrides it.
        minSdk = Math.max(flutter.minSdkVersion, 28)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // GeckoView bundles every ABI (~700 MB debug APK). When Flutter targets
        // specific platforms (flutter run, --target-platform), ship only those.
        def targetPlatform = project.findProperty("target-platform")
        if (targetPlatform) {
            def abis = [
                "android-arm": "armeabi-v7a",
                "android-arm64": "arm64-v8a",
                "android-x86": "x86",
                "android-x64": "x86_64",
            ]
            def filters = targetPlatform.toString().split(",").collect { abis[it] }.findAll()
            // The Flutter Gradle plugin sets per-build-type filters; replace them.
            buildTypes.configureEach {
                ndk.abiFilters.clear()
                ndk.abiFilters.addAll(filters)
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:158.0.20261021001945"
    implementation files("libs/hev-socks5-tunnel.aar")
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
