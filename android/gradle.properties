org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Dependencies use AndroidX; Jetifier cannot process Java 21 bytecode.
android.enableJetifier=false
# AGP 9: keep the legacy DSL and the Kotlin
# Gradle plugin, which the Flutter Gradle plugin and Flutter plugins still use.
android.newDsl=false
android.builtInKotlin=false
# Keep the target app and its data after connected instrumentation tests.
android.injected.androidTest.leaveApksInstalledAfterRun=true
